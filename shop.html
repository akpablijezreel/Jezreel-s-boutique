<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jezreel's Boutique - Shop</title>
  <style>
    body { background: #111; color: #fff; font-family: Arial; margin: 0; }
    .header { background: #000; color: #FFD700; padding: 20px; text-align: center; }
    .header a { color: #FFD700; text-decoration: none; margin: 0 10px; font-weight: bold; }
    .products { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 15px; }
    @media (min-width: 768px) { .products { grid-template-columns: repeat(4, 1fr); } }
    
    .card { background: #000; border: 1px solid #FFD700; border-radius: 12px; padding: 10px; text-align: center; }
    
    .img-box { 
      width: 100%; 
      aspect-ratio: 1/1; 
      background: #222; 
      border-radius: 8px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      overflow: hidden;
    }
    .img-box img { 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
    }
    
    .card h3 { margin: 10px 0 5px 0; font-size: 15px; }
    .price { color: #FFD700; font-size: 18px; font-weight: bold; margin-bottom: 8px; }
    .btn { background: #25D366; color: #fff; padding: 8px 10px; border-radius: 8px; text-decoration: none; display: block; font-weight: bold; font-size: 13px; }
</style> 
</head>
<body>
  <div class="header">
    <h1>JEZREEL'S BOUTIQUE</h1>
    <a href="index.html">Home</a> | <a href="shop.html">Shop</a> | <a href="about.html">About</a>
  </div>

    <div class="card">
